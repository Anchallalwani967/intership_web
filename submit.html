<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Task - SoftGrowTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="checkLogin()" class="submit-page">
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">SG</span>
                <div>
                    <h1>SoftGrowTech</h1>
                    <p>Design & Development Studio</p>
                </div>
            </div>
            <nav class="site-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="submit.html">Submit Task</a>
                <a href="view.html">View Submissions</a>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="submit-card">
            <div class="card-header">
                <h2>Submit a New Task</h2>
                <p>Fill out the form below to submit your work.</p>
            </div>
            <form class="submit-form" onsubmit="submitTask(); return false;">
                <div class="form-group">
                    <label for="title">Task Title</label>
                    <input id="title" type="text" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="desc">Description</label>
                    <textarea id="desc" rows="6" placeholder="Describe your task in detail..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="attachment">Attach File</label>
                    <input id="attachment" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg" />
                </div>
                <button type="submit" class="primary-btn">Submit Task</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© 2026 SoftGrowTech. Building smarter workflows for teams.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
