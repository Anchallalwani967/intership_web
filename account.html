<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - SoftGrowTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="checkLogin(); loadAccountDetails();" class="submit-page">
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">SG</span>
                <div>
                    <h1>SoftGrowTech</h1>
                    <p>Design & Development Studio</p>
                </div>
            </div>
            <nav class="site-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="submit.html">Submit Task</a>
                <a href="view.html">View Submissions</a>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="submit-card">
            <div class="card-header">
                <h2>Account Settings</h2>
                <p>Manage your profile information and preferences.</p>
            </div>
            <form class="submit-form" onsubmit="updateAccount(); return false;">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" type="text" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="accountEmail">Email</label>
                    <input id="accountEmail" type="email" placeholder="your@email.com" readonly style="background-color: #f0f0f0; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input id="currentPassword" type="password" placeholder="Enter your current password" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password (leave blank to keep current)</label>
                    <input id="newPassword" type="password" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input id="confirmNewPassword" type="password" placeholder="Confirm new password">
                </div>
                <button type="submit" class="primary-btn">Save Changes</button>
                <a href="dashboard.html" class="secondary-btn" style="text-align: center; margin-top: 10px; display: inline-block;">Back to Dashboard</a>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© 2026 SoftGrowTech. Building smarter workflows for teams.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
